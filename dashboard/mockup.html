<meta charset="utf-8">
<title>ColdTrust Dashboard Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: icon rail + sticky top bar + alert ticker, then one of five views.
   Dark-first (the brief asks for dark mode); graphite neutrals leaning cool, one pale-butter accent for primary
   actions and selection. Status colours (ok / warn / crit / info) are semantic and kept separate from the accent. */
:root{
  --bg:#0d0f12; --panel:#14171b; --panel2:#191d22; --line:#262b32; --line2:#323841;
  --fg:#e9ecf0; --mut:#98a1ad; --dim:#69727e;
  --accent:#ecf0a6; --on-accent:#16180a;
  --ok:#3fcf8e; --warn:#f2b441; --crit:#ff6b5e; --info:#6aa8ff;
  --map:#101317; --road:#232830; --road2:#2d343d;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f5f6f8; --line:#dde1e6; --line2:#c9cfd6;
  --fg:#15181d; --mut:#556070; --dim:#7b8593;
  --accent:#3b4210; --on-accent:#f4f7c4;
  --ok:#17935e; --warn:#a96d00; --crit:#d23a2d; --info:#2d6ad6;
  --map:#e6e9ee; --road:#d3d8df; --road2:#c3cad3; --shadow:0 10px 30px rgba(20,30,50,.14); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f5f6f8; --line:#dde1e6; --line2:#c9cfd6;
  --fg:#15181d; --mut:#556070; --dim:#7b8593;
  --accent:#3b4210; --on-accent:#f4f7c4;
  --ok:#17935e; --warn:#a96d00; --crit:#d23a2d; --info:#2d6ad6;
  --map:#e6e9ee; --road:#d3d8df; --road2:#c3cad3; --shadow:0 10px 30px rgba(20,30,50,.14); color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tn{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .dim{color:var(--dim)}

.app{display:grid;grid-template-columns:60px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rail .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.rail button:hover{background:var(--panel2);color:var(--fg)}
.rail button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.rail .sp{flex:1}
.wrap{padding:0 20px 90px;min-width:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;font-size:16px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:5px 13px;border-radius:999px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.search{position:relative;flex:1;min-width:180px;max-width:420px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 52px 8px 34px;color:var(--fg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.pop{position:absolute;z-index:30;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:260px}
.pop[hidden]{display:none}
.pop .it{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:8px 10px;border-radius:9px}
.pop .it:hover{background:var(--panel2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mut);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.grow{flex:1}
.ico-btn{position:relative;width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.ico-btn .n{position:absolute;top:-5px;right:-5px;background:var(--crit);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 5px}
.av{width:28px;height:28px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line2)}
.relw{position:relative}

/* ticker */
.ticker{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:38px;overflow:hidden}
.ticker .lbl{font:600 11px var(--mono);letter-spacing:.8px;color:var(--mut);white-space:nowrap}
.ticker .track{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker .run{display:inline-flex;gap:38px;white-space:nowrap;animation:tick 34s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.ticker .a{display:inline-flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){.ticker .run{animation:none;padding-left:0}}

/* header + tabs */
.crumb{font-size:12px;color:var(--dim);margin:18px 0 6px}
.vhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.vhead h1{margin:0;font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.4px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:500;color:var(--fg)}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;overflow-x:auto}
.tabs button{padding:9px 14px;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.tabs .c{font-size:11px;background:var(--panel2);border-radius:999px;padding:1px 7px;margin-left:5px;color:var(--mut)}

/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-width:0}
.card>.h{display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.card>.h h3{margin:0;font-size:15px;font-weight:600}
.card>.b{padding:14px 16px 16px}
.g{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gcargo{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:1100px){.g2,.gcargo{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.rail{display:none}.wrap{padding:0 16px 120px}.vhead h1{font-size:24px}.g4{grid-template-columns:minmax(0,1fr)}}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.t-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.t-crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 16%,transparent)}
.t-info{color:var(--info);background:color-mix(in srgb,var(--info) 15%,transparent)}
.t-mut{color:var(--mut);background:var(--panel2)}
.tag{font-size:11px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:1px 7px;white-space:nowrap}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--info)}

/* map */
.map{position:relative;background:var(--map);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.mapov{position:absolute;left:12px;top:12px;width:min(300px,calc(100% - 24px));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.mapov h4{margin:0;font-size:16px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.maptools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tog{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px}
.tog .sw{width:28px;height:16px;border-radius:99px;background:var(--line2);position:relative}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--fg);transition:transform .15s}
.tog.on .sw{background:var(--ok)} .tog.on .sw::after{transform:translateX(12px);background:#fff}
.mapov .coll{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);color:var(--mut);font-size:12.5px}
.mapov .alog{margin-top:6px;display:grid;gap:6px;max-height:130px;overflow:auto}
.mapov .alog div{font-size:12px;display:flex;gap:7px;align-items:flex-start}
.pulse{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.35}}
@media (max-width:760px){.mapov{position:static;width:auto;margin:10px;box-shadow:none}.maptools{display:none}}

/* terminal */
.term{background:#0a0c0e;color:#cfd6df;border:1px solid var(--line);border-radius:12px;font:12.5px/1.55 var(--mono);height:340px;overflow:auto;padding:12px 14px}
:root[data-theme="light"] .term{background:#12161a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .term{background:#12161a}}
.term .ln{padding:7px 0;border-bottom:1px dashed #20262d}
.term .ts{color:#6f7a86}
.term .pt{font-weight:600;padding:0 6px;border-radius:5px;margin:0 6px}
.term .pt.ROUTINE{color:#8aa0b8;background:#1a212a}
.term .pt.EVENT{color:#ffd37a;background:#2c2412}
.term .pt.HUMAN{color:#9ad4ff;background:#12263a}
.term .kv{color:#9fb0c2}
.term .sub{padding-left:22px;color:#aab4c0}
.term .sub i{font-style:normal;color:#6f7a86;display:inline-block;min-width:78px}
.term .sub.act{color:#7ee0b0}
.term .sev-crit .sub:not(.act){color:#ffb4ac}
.term .sev-emergency{background:linear-gradient(90deg,rgba(255,107,94,.12),transparent)}
.term .cur{display:inline-block;width:8px;height:14px;background:#7ee0b0;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.term .cur{animation:none}}

/* cargo */
.truck{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:stretch}
.cab{background:var(--panel2);border:1px solid var(--line2);border-radius:14px 22px 22px 14px;display:grid;place-items:center;color:var(--dim);font:600 11px var(--mono);letter-spacing:1px;writing-mode:vertical-rl;transform:rotate(180deg)}
.hold{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;background:var(--panel2);border:1px dashed var(--line2);border-radius:16px;padding:10px}
.slot{min-width:0;text-align:left;border-radius:11px;border:1.5px solid var(--line2);background:var(--panel);padding:8px 8px 7px;display:grid;gap:6px;min-height:78px;align-content:space-between;transition:transform .12s}
.slot:hover{transform:translateY(-2px)}
.slot .id{font:600 11.5px var(--mono);overflow:hidden;text-overflow:ellipsis}
.slot.s-NORMAL{border-color:color-mix(in srgb,var(--ok) 60%,var(--line2))}
.slot.s-UNDER_REVIEW{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--panel))}
.slot.s-QUARANTINED{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 11%,var(--panel))}
.slot.sel{box-shadow:0 0 0 2px var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cam{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#06080a}
.cam svg{display:block;width:100%;height:auto}

/* packages */
.plist{display:grid;gap:8px;max-height:640px;overflow:auto;padding-right:2px}
.pk{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;gap:7px}
.pk.sel{border-color:var(--accent)}
.pk .r{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.kvs dt{font-size:11.5px;color:var(--dim)} .kvs dd{margin:1px 0 0;font-weight:500;overflow-wrap:anywhere}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:12px;padding:10px 12px;font-size:13px}
.critbox{border:1px solid color-mix(in srgb,var(--crit) 50%,transparent);background:color-mix(in srgb,var(--crit) 11%,transparent);border-radius:12px;padding:10px 12px;font-size:13px}
.ovr{display:grid;gap:8px;margin-top:4px}
.ovr input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:12.5px}
.filters button.on{border-color:var(--accent);color:var(--fg)}

/* misc */
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--mut)}
.list{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.tl{position:relative;display:grid;gap:12px;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--info)}
.tl>div.crit::before{border-color:var(--crit)} .tl>div.ok::before{border-color:var(--ok)} .tl>div.warn::before{border-color:var(--warn)}
.paper{background:#f7f6f1;color:#1b1b18;border-radius:12px;padding:20px;font:13px/1.55 var(--ui);position:relative;overflow:hidden}
.paper h4{margin:0 0 4px;font-size:16px}
.paper .stamp{position:absolute;right:-30px;top:20px;transform:rotate(18deg);border:2px solid #b3261e;color:#b3261e;font:700 11px var(--mono);padding:3px 38px;letter-spacing:1px}
.paper table{width:100%;border-collapse:collapse;margin:8px 0}
.paper td{padding:4px 6px;border-bottom:1px solid #dcdad0;vertical-align:top}
.paper td:first-child{color:#6b6a60;width:34%}
.toast{position:fixed;right:16px;top:calc(76px + env(safe-area-inset-top,0px));z-index:50;width:min(380px,calc(100% - 32px));display:grid;gap:8px}
.toast .t{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--crit);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);animation:slide .25s ease-out}
.toast .t.warn{border-left-color:var(--warn)} .toast .t.info{border-left-color:var(--info)} .toast .t.ok{border-left-color:var(--ok)}
@keyframes slide{from{transform:translateY(-8px);opacity:0}}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:8px 10px;display:flex;gap:6px;align-items:center;overflow-x:auto}
.dock .lab{font:600 10.5px var(--mono);letter-spacing:.8px;color:var(--dim);padding:0 6px;white-space:nowrap}
.dock button.s{padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:12.5px;white-space:nowrap}
.dock button.s.on{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.note{font-size:12px;color:var(--dim)}
.sr{position:absolute;left:-9999px}
</style>

<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M4.2 6.5l15.6 11M19.8 6.5L4.2 17.5M8.5 3.8 12 7l3.5-3.2M8.5 20.2 12 17l3.5 3.2"/></svg></div>
    <button class="on" data-act="tab" data-v="overview" title="Operations" aria-label="Operations"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
    <button data-act="tab" data-v="cargo" title="Cargo" aria-label="Cargo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></button>
    <button data-act="tab" data-v="route" title="Route" aria-label="Route"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg></button>
    <button data-act="tab" data-v="incidents" title="Incidents" aria-label="Incidents"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></svg></button>
    <div class="sp"></div>
    <button data-act="menu" data-v="settings" title="Settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></button>
  </nav>

  <div class="wrap">

function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arc(cx,cy,r,a0,a1){const [x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`}
/* 240-degree gauge, -120..+120 */
function gauge({v,min,max,unit,label,color,band,mark,size=150,sub}){
  const A0=-120,A1=120,f=x=>A0+(A1-A0)*Math.max(0,Math.min(1,(x-min)/(max-min)));
  const cx=75,cy=78,r=56;
  let s=`<svg viewBox="0 0 150 128" width="100%" style="max-width:${size}px" role="img" aria-label="${esc(label)} ${v} ${unit}">`;
  s+=`<path d="${arc(cx,cy,r,A0,A1)}" stroke="var(--line2)" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  if(band)s+=`<path d="${arc(cx,cy,r,f(band[0]),f(band[1]))}" stroke="color-mix(in srgb,var(--ok) 55%,transparent)" stroke-width="10" fill="none"/>`;
  s+=`<path d="${arc(cx,cy,r,A0,Math.max(A0+1,f(v)))}" stroke="${color}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  if(mark!=null){const [x0,y0]=polar(cx,cy,r-9,f(mark)),[x1,y1]=polar(cx,cy,r+9,f(mark));s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--fg)" stroke-width="2"/>`}
  s+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="26" font-weight="600" fill="var(--fg)" font-family="var(--ui)">${v}</text>`;
  s+=`<text x="${cx}" y="${cy+21}" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="var(--ui)">${unit}</text>`;
  s+=`<text x="${cx}" y="122" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="var(--ui)">${esc(label)}${sub?' · '+esc(sub):''}</text></svg>`;
  return s;
}
function seeded(n,seed){let x=seed;return Array.from({length:n},()=>{x=(x*9301+49297)%233280;return x/233280})}
function tempSeries(n=60){

    if(k==='theft'&&t>.6)v+=(t-.6)/.4*1.2;
    if(k==='thermal'&&t>.15)v+=(t-.15)/.85*8.2;
    return Math.round(v*10)/10});
}
function lineChart(series,{w=520,h=150,min=0,max=14,band=[2,8],unit='°C',labels=null}={}){
  const pl=34,pr=10,pt=10,pb=22,X=i=>pl+(w-pl-pr)*i/(series.length-1),Y=v=>pt+(h-pt-pb)*(1-(v-min)/(max-min));
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Temperature trend">`;
  if(band)s+=`<rect x="${pl}" y="${Y(band[1])}" width="${w-pl-pr}" height="${Y(band[0])-Y(band[1])}" fill="color-mix(in srgb,var(--ok) 11%,transparent)"/>`;
  for(let g=min;g<=max;g+=Math.ceil((max-min)/4)){s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${Y(g)+4}" text-anchor="end" font-size="10.5" fill="var(--dim)">${g}</text>`}
  const pts=series.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  s+=`<polygon points="${pl},${h-pb} ${pts} ${w-pr},${h-pb}" fill="color-mix(in srgb,var(--info) 14%,transparent)"/><polyline points="${pts}" fill="none" stroke="var(--info)" stroke-width="2" stroke-linejoin="round"/>`;
  const lx=X(series.length-1),ly=Y(series[series.length-1]);
  s+=`<circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--info)" stroke="var(--panel)" stroke-width="2"/>`;
  (labels||['-30 min','-20','-10','now']).forEach((t,i,a)=>{s+=`<text x="${pl+(w-pl-pr)*i/(a.length-1)}" y="${h-5}" text-anchor="${i===0?'start':i===a.length-1?'end':'middle'}" font-size="10.5" fill="var(--dim)">${t}</text>`});
  return s+'</svg>';
}

   <radialGradient id="l${i}" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fff6d6" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></radialGradient></defs>
   <rect width="320" height="180" fill="url(#g${i})"/>
   <path d="M30 20 H290 L260 150 H60Z" fill="#0f1318" stroke="#1f262e"/>
   <g fill="#161b21" stroke="#252c35"><rect x="78" y="60" width="52" height="40"/><rect x="136" y="60" width="52" height="40"/><rect x="194" y="60" width="48" height="40"/><rect x="92" y="104" width="64" height="36"/><rect x="162" y="104" width="64" height="36"/></g>`;
  if(lit)s+=`<ellipse cx="160" cy="100" rx="130" ry="90" fill="url(#l${i})"/><rect x="40" y="26" width="240" height="6" fill="#fff6d6" opacity=".85"/>`;

    s+=`<g><circle cx="168" cy="72" r="11" fill="#2a313a"/><rect x="152" y="84" width="32" height="56" rx="12" fill="#2a313a"/><rect x="142" y="52" width="52" height="94" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="5 3"/>
     <rect x="142" y="38" width="${kind==='theft'?96:112}" height="14" fill="${c}"/><text x="147" y="49" font-size="10" font-weight="700" fill="#0b0e12" font-family="monospace">${kind==='theft'?'person 0.93':'authorised stop'}</text></g>`;
  }
  s+=`<circle cx="14" cy="14" r="4.5" fill="#ff4d4d"/><text x="24" y="18" font-size="10" fill="#d7dde5" font-family="monospace">REC  CAM-01</text>

  if(kind==='idle')s+=`<text x="160" y="170" text-anchor="middle" font-size="10" fill="#6f7a86" font-family="monospace">no motion · hold dark</text>`;
  return s+'</svg>';
}

      <div class="paper"><div class="stamp">DRAFT</div><h4>Incident report ${inc.id}</h4><div style="color:#6b6a60;margin-bottom:6px">Vehicle TX-9913-HX · driver Marcus Lee (DRV-20418) · Dallas, TX to Memphis, TN</div>
       <table><tr><td>Date / time</td><td>${new Date().toDateString()}, 15:49 local</td></tr><tr><td>Location</td><td>I-30 eastbound, mile 112 (no authorised stop)</td></tr>
       <tr><td>Summary</td><td>${esc(live?c.block.reason:'Historical incident; see attached pack.')}</td></tr>
       <tr><td>Goods affected</td><td>10 packages, 28,700 lbs (temperature-controlled)</td></tr>
       <tr><td>Evidence</td><td class="mono" style="font-size:12px">3 frames, 1 clip · SHA-256 4be1a9…, 90cf22…, 7d03be…</td></tr>
       <tr><td>Sensor record</td><td>Temperature 3 to 4 °C; light 2% to 74%; 41 readings</td></tr></table></div>
      <div class="row" style="margin-top:12px"><label style="display:flex;gap:9px;align-items:center"><input type="checkbox" id="rev" ${S.reviewed?'checked':''} data-act="rev"> I have reviewed the evidence and the summary</label>
        <button class="btn pri" data-act="approve" ${S.reviewed&&!S.approved?'':'disabled'}>${S.approved?'Approved':'Approve for filing'}</button></div>
      ${S.approved?`<div class="warnbox" style="margin-top:10px">Approved by Lisa Nguyen at ${clock()}. Submit the report to the police yourself; ColdTrust does not file on your behalf.</div>`:''}</div></div></div></div>`;
}

/* ============================== chrome ============================== */
const TABS=[['overview','Overview'],['cargo','Cargo'],['maintenance','Maintenance'],['route','Route'],['incidents','Incidents']];
function renderChrome(){
  const c=counts(),s=sc(),w=worst();
  $('#kpis').innerHTML=`<span class="chip">Hold <b class="tn">${s.temp} °C</b></span><span class="chip">Light <b class="tn">${s.light}%</b></span><span class="chip">Cleared <b class="tn">${c.NORMAL}/10</b></span><span class="chip">Link <b>${S.scen==='replay'?'Rejected payload':'Online · ping 0:42 ago'}</b></span>`;
  $('#vstat').innerHTML=pill(TONE[w],w==='NORMAL'?'Normal':w==='UNDER_REVIEW'?'Under review':'Quarantined - do not accept');
  const al=activeAlerts();
  $('#ticker').innerHTML=al.length?al.concat(al).map(a=>`<span class="a">${pill(a.sev==='crit'?'crit':'warn',a.sev==='crit'?'CRITICAL':'WARNING',false)}<b>${esc(a.title)}</b><span class="mut">${esc(a.text)}</span><button class="btn sm" data-act="ack" data-v="${a.id}">Acknowledge</button></span>`).join(''):`<span class="mut">No active alerts. Hold at ${s.temp} °C, light ${s.light}%.</span>`;
  const n=al.length;const b=$('#bellN');b.hidden=!n;b.textContent=n;
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" data-act="tab" data-v="${k}">${t}${k==='cargo'&&c.QUARANTINED?`<span class="c">${c.QUARANTINED}</span>`:k==='incidents'&&s.incident?'<span class="c">1</span>':''}</button>`).join('');
  $$('.rail button[data-v]').forEach(b=>{if(b.dataset.act==='tab')b.classList.toggle('on',b.dataset.v===S.tab)});
  $('#dockBtns').innerHTML=Object.entries(SC).map(([k,v])=>`<button class="s ${S.scen===k?'on':''}" data-act="scen" data-v="${k}">${v.name}</button>`).join('');
  $$('.seg [data-act=module]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.module));
  const vb=$('#voiceBtn');vb.textContent=S.voice?'On':'Off';vb.setAttribute('aria-pressed',S.voice);vb.classList.toggle('on',S.voice);
  $('#pop-bell').innerHTML=`<div class="mut" style="padding:6px 10px;font-size:12px">Notifications</div>`+(S.log.filter(l=>l.sev!=='info').slice(-5).reverse().map(l=>`<div class="it"><span><b style="font-weight:600">${esc(l.type==='HUMAN'?'Supervisor action':l.find?l.find.split('(')[0]:'Event')}</b><br><span class="mut" style="font-size:12px">${esc(l.reason.slice(0,92))}…</span></span><span class="mono dim">${l.ts}</span></div>`).join('')||'<div class="it mut">Nothing yet.</div>');
  $('#pop-profile').innerHTML=`<div class="it" style="display:block"><b>Lisa Nguyen</b><div class="mut">Fleet manager · lisa@coldtrust.example</div></div>
    <div class="it" style="display:block"><div class="mut" style="font-size:12px;margin-bottom:6px">Monitoring settings (read-only demo)</div><div class="mono" style="font-size:12px;line-height:1.8">log interval 30 s<br>routine ping 15 min · event ping instant<br>rate limit 0.5 °C/min · step 5 °C/min<br>light alarm ≥ 30% · hold limits 2–8 °C</div></div>
    <button class="it" data-act="theme"><span>Switch theme</span><span class="mut">Dark / Light</span></button>
    <button class="it" data-act="voice"><span>Voice alerts</span><span class="mut">${S.voice?'On':'Off'}</span></button>
    <button class="it" data-act="toast-info" data-v="Signed out (demo)"><span>Sign out</span></button>`;
  ['bell','profile'].forEach(k=>$('#pop-'+k).hidden=S.menu!==k);
}
function renderView(){
  const v={overview:vOverview,cargo:vCargo,maintenance:vMaintenance,route:vRoute,incidents:vIncidents}[S.tab]();
  $('#view').innerHTML=v;
  placeTruck();
  const t=$('#term');if(t)t.scrollTop=t.scrollHeight;
}
function render(){renderChrome();renderView()}

function toast(sev,title,text){
  const el=document.createElement('div');el.className='t '+sev;el.innerHTML=`<b>${esc(title)}</b><div class="mut">${esc(text)}</div>`;
  $('#toast').appendChild(el);setTimeout(()=>el.remove(),6500);
}
function speak(t){if(!S.voice||!t)return;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}
function setScenario(k){
  S.scen=k;S.ov={};S.acked={};S.reassign=false;
  const c=sc();
  if(c.block){S.log.push({ts:clock(),type:c.block.type,sev:c.block.sev,params:c.block.params,find:c.block.find,reason:c.block.reason,action:c.block.action});}
  else S.log.push({ts:clock(),type:'ROUTINE',sev:'info',params:`temp=${c.temp}C hum=${c.hum}% light=${c.light}% seq=${2040+S.log.length} n=12`,reason:'All readings within limits.'});
  render();
  if(c.alerts.length){toast(c.alerts[0].sev==='crit'?'crit':'warn',c.alerts[0].title,c.alerts[0].text+(c.channels?` · voice ${c.channels.voice.toFixed(1)} s, Telegram ${c.channels.tg.toFixed(1)} s`:''));speak(c.voice)}
}

/* ============================== events ============================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!e.target.closest('.relw')&&S.menu){S.menu=null;renderChrome()}
  if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='tab'){S.tab=v;S.menu=null;render()}
  else if(a==='scen')setScenario(v);
  else if(a==='pick'){S.sel=(S.sel===v&&S.tab==='cargo'&&el.classList.contains('slot')===false)?null:v;S.reassign=false;if(S.tab!=='cargo')S.tab='cargo';render()}
  else if(a==='filter'){S.filter=v;render()}
  else if(a==='module'){S.module=v;render()}
  else if(a==='mt'){S[v]=!S[v];renderView()}
  else if(a==='alog'){S.alogOpen=!S.alogOpen;renderView()}
  else if(a==='ack'){S.acked[S.scen+v]=1;S.log.push({ts:clock(),type:'HUMAN',sev:'info',params:`alert ${v} acknowledged by Lisa Nguyen`,reason:'Acknowledgement recorded; escalation timer cancelled.'});render()}
  else if(a==='voice'){S.voice=!S.voice;if(S.voice)speak('Voice alerts enabled.');render()}
  else if(a==='menu'){S.menu=(v==='settings')?'profile':(S.menu===v?null:v);renderChrome()}
  else if(a==='theme'){const r=document.documentElement;const dark=getComputedStyle(r).colorScheme.includes('dark')&&r.dataset.theme!=='light';r.dataset.theme=dark?'light':'dark';S.menu=null;render()}
  else if(a==='toast-info')toast('info','Demo action',v);
  else if(a==='reassign'){S.reassign=!S.reassign;renderView()}
  else if(a==='reassign-ok'){const t=$('#rtruck').value.split(' ')[0];S.reassign=false;S.log.push({ts:clock(),type:'HUMAN',sev:'info',params:`${v} reassigned to ${t}`,reason:'Capacity and temperature limits of the target truck were re-checked.'});toast('ok','Reassigned',`${v} moved to ${t}`);render()}
  else if(a==='ovs'){S.ovStatus=v;renderView()}
  else if(a==='ovr-ok'){
    const why=($('#ovr').value||'').trim();
    if(why.length<3){toast('warn','Reason required','Enter at least 3 characters so the override can be audited.');$('#ovr').focus();return}
    S.ov[v]=S.ovStatus;S.log.push({ts:clock(),type:'HUMAN',sev:'warn',params:`${v} -> ${S.ovStatus} by Lisa Nguyen`,reason:'Supervisor override: '+why,action:S.ovStatus==='NORMAL'?`${v}: custody token re-issued; old token stays revoked`:`${v}: status set manually`});
    toast('info','Override logged',`${v} is now ${LABEL[S.ovStatus]}`);render()}
  else if(a==='inc'){S.incSel=+v;render()}
  else if(a==='approve'){S.approved=true;render()}
});
document.addEventListener('change',e=>{if(e.target.id==='rev'){S.reviewed=e.target.checked;S.approved=false;renderView()}});
const q=$('#q'),qres=$('#qres');
q.addEventListener('input',()=>{
  QTEXT=q.value.trim().toLowerCase();
  if(!QTEXT){qres.hidden=true;if(S.tab==='cargo')renderView();return}
  const r=PK.filter(matches).slice(0,5);
  qres.innerHTML=r.length?r.map(p=>`<button class="it" data-act="pick" data-v="${p.id}"><span><b class="mono">${p.id}</b> ${esc(p.d)}<br><span class="mut" style="font-size:12px">${esc(p.client)} · ${esc(p.dest)}</span></span>${pill(TONE[status(p)],LABEL[status(p)].split(' - ')[0],false)}</button>`).join(''):'<div class="it mut">No match.</div>';
  qres.hidden=false;
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus()}if(e.key==='Escape'){qres.hidden=true;S.menu=null;renderChrome()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))qres.hidden=true});
render();
</script>
