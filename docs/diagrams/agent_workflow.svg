<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1000" viewBox="0 0 1720 1000" font-family="'Segoe UI', Arial, Helvetica, sans-serif"><defs><marker id="head-1f2933" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#1f2933"/></marker><marker id="head-2563eb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#2563eb"/></marker><marker id="head-15803d" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#15803d"/></marker><marker id="head-b45309" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#b45309"/></marker><marker id="head-b91c1c" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#b91c1c"/></marker><marker id="head-4b5563" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="52" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">AI agent workflow</text><text x="40" y="82" font-size="18" font-weight="400" fill="#52606d" text-anchor="start">Rules decide the status. Agents explain and propose. A human approves anything disruptive.</text><rect x="40" y="115" width="330" height="130" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"/><circle cx="62" cy="140" r="13" fill="#2563eb"/><text x="62" y="146" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="84" y="146" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Events</text><text x="58" y="173" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">signed sensor batches</text><text x="58" y="196" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">camera sightings</text><text x="58" y="219" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">zone + speed</text><rect x="430" y="115" width="330" height="130" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.2"/><circle cx="452" cy="140" r="13" fill="#4b5563"/><text x="452" y="146" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="474" y="146" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Integrity gate</text><text x="448" y="173" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">signature · sequence ·</text><text x="448" y="196" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">time window · replay</text><rect x="820" y="115" width="330" height="130" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.2"/><circle cx="842" cy="140" r="13" fill="#4b5563"/><text x="842" y="146" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="864" y="146" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Seal trust report</text><text x="838" y="173" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">8 integrity checks, each</text><text x="838" y="196" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">passed / suspicious / failed</text><text x="838" y="219" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">/ not run</text><rect x="1210" y="115" width="330" height="130" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.2"/><circle cx="1232" cy="140" r="13" fill="#4b5563"/><text x="1232" y="146" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="1254" y="146" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Rules engine</text><text x="1228" y="173" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">status · risk score</text><text x="1228" y="196" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">auto-hold cargo on theft</text><path d="M 370 180.0 L 430 180.0" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 760 180.0 L 820 180.0" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 1150 180.0 L 1210 180.0" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><rect x="430" y="290" width="330" height="70" rx="14" fill="#fdecec" stroke="#b91c1c" stroke-width="2.2"/><text x="448" y="321" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">Rejected + logged</text><text x="448" y="348" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">never reaches the agents</text><path d="M 595.0 245 L 595.0 290" fill="none" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#head-b91c1c)"/><text x="609.0" y="272" font-size="15" font-weight="400" fill="#b91c1c" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">bad data</text><text x="1550" y="185" font-size="1" font-weight="400" fill="#1f2933" text-anchor="start"></text><rect x="380" y="400" width="1300" height="250" rx="20" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 7"/><text x="400" y="428" font-size="17" font-weight="700" fill="#2563eb" text-anchor="start">AI agents (Gemini)  ·  one call per alert  ·  every number checked against the data</text><circle cx="560" cy="483.0" r="15.0" fill="#2563eb"/><path d="M 530.0 527.0 Q 530.0 503.0 560 503.0 Q 590.0 503.0 590.0 527.0 Z" fill="#2563eb"/><text x="560" y="551.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Thermal agent</text><text x="560" y="574.0" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">temperature, freeze risk,</text><text x="560" y="597.0" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">maintenance review</text><circle cx="1030" cy="483.0" r="15.0" fill="#2563eb"/><path d="M 1000.0 527.0 Q 1000.0 503.0 1030 503.0 Q 1060.0 503.0 1060.0 527.0 Z" fill="#2563eb"/><text x="1030" y="551.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Seal agent</text><text x="1030" y="574.0" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">door events and</text><text x="1030" y="597.0" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">data trust</text><circle cx="1500" cy="483.0" r="15.0" fill="#2563eb"/><path d="M 1470.0 527.0 Q 1470.0 503.0 1500 503.0 Q 1530.0 503.0 1530.0 527.0 Z" fill="#2563eb"/><text x="1500" y="551.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Incident agent</text><text x="1500" y="574.0" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">person, theft; proposes</text><text x="1500" y="597.0" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">actions from a fixed menu</text><path d="M 1375.0 245 L 1375.0 400" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="1389.0" y="305" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">findings + status</text><text x="1389.0" y="324" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">set by rules</text><path d="M 985.0 245 L 985.0 400" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="999.0" y="330" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">data check handed</text><text x="999.0" y="349" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">to every agent</text><rect x="640" y="609" width="631.5200000000001" height="26" rx="13" fill="#fff4d6" stroke="#b45309" stroke-width="1.5"/><text x="650" y="627" font-size="14" font-weight="600" fill="#b45309" text-anchor="start">numbers checked · menu limited by the rules · rule-based text if the AI is off</text><rect x="40" y="740" width="300" height="170" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"/><circle cx="62" cy="765" r="13" fill="#2563eb"/><text x="62" y="771" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="84" y="771" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Maintenance review</text><text x="58" y="798" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Thermal agent reads the sensor</text><text x="58" y="821" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">history: is the cooling unit</text><text x="58" y="844" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">weakening?</text><text x="58" y="867" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">(temperature events only)</text><rect x="420" y="740" width="310" height="170" rx="14" fill="#fff4d6" stroke="#b45309" stroke-width="2.2"/><circle cx="442" cy="765" r="13" fill="#b45309"/><text x="442" y="771" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="464" y="771" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Report gate</text><text x="438" y="798" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">a temperature event becomes an</text><text x="438" y="821" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">incident report only if the</text><text x="438" y="844" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">review finds the unit may be</text><text x="438" y="867" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">failing</text><rect x="820" y="740" width="330" height="170" rx="14" fill="#fff4d6" stroke="#b45309" stroke-width="2.2"/><circle cx="842" cy="765" r="13" fill="#b45309"/><text x="842" y="771" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="864" y="771" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Proposals</text><text x="838" y="798" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">quarantine · divert to backup cold</text><text x="838" y="821" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">store · take vehicle offline ·</text><text x="838" y="844" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">prepare report</text><text x="838" y="867" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">the rules limit the menu</text><circle cx="1290" cy="773.0" r="15.0" fill="#15803d"/><path d="M 1260.0 817.0 Q 1260.0 793.0 1290 793.0 Q 1320.0 793.0 1320.0 817.0 Z" fill="#15803d"/><text x="1290" y="841.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Admin</text><text x="1290" y="864.0" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">approves or rejects</text><circle cx="1290" cy="877.9" r="8.25" fill="#15803d"/><path d="M 1273.5 902.1 Q 1273.5 888.9 1290 888.9 Q 1306.5 888.9 1306.5 902.1 Z" fill="#15803d"/><text x="1290" y="915.3" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Driver</text><text x="1290" y="938.3" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">alerts, read-only</text><rect x="1430" y="740" width="250" height="170" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="2.2"/><circle cx="1452" cy="765" r="13" fill="#15803d"/><text x="1452" y="771" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="1474" y="771" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Action + records</text><text x="1448" y="798" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Telegram alert</text><text x="1448" y="821" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Word report + evidence</text><text x="1448" y="844" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">photos</text><text x="1448" y="867" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">GS1 EPCIS events</text><text x="1448" y="890" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">audit log of the decision</text><path d="M 560 650 L 200 740" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="250" y="690" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">temperature</text><text x="250" y="709" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">events</text><path d="M 340 825.0 L 420 825.0" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 730 825.0 L 820 825.0" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="775" y="813.0" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">if allowed</text><path d="M 985 650 L 985 740" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="1000" y="700" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">AI proposals, or the rules&#x27;</text><text x="1000" y="719" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">default if the AI is off</text><path d="M 1150 820 L 1240 820" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 1345 820 L 1430 820" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="1388" y="800" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">approved</text><path d="M 1540 650 L 1540 740" fill="none" stroke="#15803d" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#head-15803d)"/><text x="1526" y="700" font-size="15" font-weight="400" fill="#15803d" text-anchor="end" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">person or theft: draft</text><text x="1526" y="719" font-size="15" font-weight="400" fill="#15803d" text-anchor="end" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">report made automatically</text><circle cx="60" cy="949.76" r="6.3" fill="#2563eb"/><path d="M 47.4 968.24 Q 47.4 958.16 60 958.16 Q 72.6 958.16 72.6 968.24 Z" fill="#2563eb"/><text x="60" y="978.32" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle"></text><text x="88" y="966" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">AI agent</text><circle cx="200" cy="949.76" r="6.3" fill="#15803d"/><path d="M 187.4 968.24 Q 187.4 958.16 200 958.16 Q 212.6 958.16 212.6 968.24 Z" fill="#15803d"/><text x="200" y="978.32" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle"></text><text x="228" y="966" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">person</text><rect x="360" y="946" width="30" height="22" rx="5" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/><text x="400" y="966" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">rules (ordinary code)</text><rect x="590" y="946" width="30" height="22" rx="5" fill="#fff4d6" stroke="#b45309" stroke-width="2"/><text x="630" y="966" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">safeguard / human approval point</text></svg>