<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="960" viewBox="0 0 1720 960" font-family="'Segoe UI', Arial, Helvetica, sans-serif"><defs><marker id="head-1f2933" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#1f2933"/></marker><marker id="head-2563eb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#2563eb"/></marker><marker id="head-15803d" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#15803d"/></marker><marker id="head-b45309" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#b45309"/></marker><marker id="head-b91c1c" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#b91c1c"/></marker><marker id="head-4b5563" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="52" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">Architecture</text><text x="40" y="82" font-size="18" font-weight="400" fill="#52606d" text-anchor="start">Frozen Warden: a cold-chain guardian that checks its own data before it acts</text><text x="40" y="135" font-size="18" font-weight="700" fill="#52606d" text-anchor="start">At a glance</text><rect x="40" y="155" width="230" height="120" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"/><text x="155.0" y="186" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Truck</text><text x="155.0" y="213" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">sensors + camera</text><text x="155.0" y="236" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">in the cargo hold</text><rect x="40" y="395" width="230" height="140" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.2"/><text x="155.0" y="426" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Frozen Warden</text><text x="155.0" y="453" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">checks the data,</text><text x="155.0" y="476" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">decides status,</text><text x="155.0" y="499" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">AI explains + proposes</text><rect x="40" y="655" width="230" height="120" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="2.2"/><text x="155.0" y="686" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">People</text><text x="155.0" y="713" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">admin approves,</text><text x="155.0" y="736" font-size="16" font-weight="400" fill="#52606d" text-anchor="middle">driver is alerted</text><path d="M 155 275 L 155 395" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="170" y="340" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">signed data</text><path d="M 155 535 L 155 655" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="170" y="600" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">alerts + proposals</text><rect x="310" y="100" width="1370" height="830" rx="20" fill="none" stroke="#52606d" stroke-width="2" stroke-dasharray="3 7"/><text x="330" y="128" font-size="17" font-weight="700" fill="#52606d" text-anchor="start"></text><text x="334" y="912" font-size="17" font-weight="700" fill="#52606d" text-anchor="start">Frozen Warden system in detail</text><text x="340" y="148" font-size="17" font-weight="700" fill="#2563eb" text-anchor="start">Inputs (the truck)</text><rect x="340" y="165" width="300" height="190" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"/><text x="358" y="196" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Cargo-hold sensor node</text><text x="358" y="223" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">NodeMCU ESP8266</text><text x="358" y="246" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">DHT11: temperature + humidity</text><text x="358" y="269" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Light module: door open</text><text x="358" y="292" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">LEDs: local status</text><text x="358" y="315" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">sends signed JSON over Wi-Fi</text><rect x="340" y="410" width="300" height="160" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"/><text x="358" y="441" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Cargo camera</text><text x="358" y="468" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Logitech C270 (USB)</text><text x="358" y="491" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">MediaPipe: person + pose cues</text><text x="358" y="514" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">never identifies anyone</text><text x="358" y="537" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">sends sightings + frames</text><rect x="340" y="605" width="300" height="200" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"/><text x="358" y="636" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Route and zone context</text><text x="358" y="663" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">OSRM road route (OpenStreetMap)</text><text x="358" y="686" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">geofences: docks, risk stretch,</text><text x="358" y="709" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">backup cold store</text><text x="358" y="732" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">position + speed (simulated in</text><text x="358" y="755" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">the prototype)</text><rect x="690" y="120" width="500" height="790" rx="20" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="3 7"/><text x="710" y="148" font-size="17" font-weight="700" fill="#4b5563" text-anchor="start">FastAPI backend + SQLite (runs locally)</text><rect x="715" y="160" width="450" height="92" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.2"/><circle cx="737" cy="185" r="13" fill="#4b5563"/><text x="737" y="191" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="759" y="191" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Integrity gate</text><text x="733" y="218" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">signature · sequence · time window · replay</text><rect x="715" y="282" width="450" height="92" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.2"/><circle cx="737" cy="307" r="13" fill="#4b5563"/><text x="737" y="313" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="759" y="313" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Seal trust report</text><text x="733" y="340" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">8 checks: passed / suspicious / failed / not run</text><rect x="715" y="404" width="450" height="100" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.2"/><circle cx="737" cy="429" r="13" fill="#4b5563"/><text x="737" y="435" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="759" y="435" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Rules engine</text><text x="733" y="462" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">status · risk score · quarantine · custody tokens</text><text x="733" y="485" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">rules decide; the AI never changes a status</text><rect x="715" y="534" width="450" height="112" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"/><circle cx="737" cy="559" r="13" fill="#2563eb"/><text x="737" y="565" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="759" y="565" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">AI agents (Gemini API, free tier)</text><text x="733" y="592" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Thermal · Seal · Incident</text><text x="733" y="615" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">one call per alert; every number is checked</text><text x="733" y="638" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">against the data</text><rect x="715" y="676" width="450" height="92" rx="14" fill="#fff4d6" stroke="#b45309" stroke-width="2.2"/><circle cx="737" cy="701" r="13" fill="#b45309"/><text x="737" y="707" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="759" y="707" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Approvals queue</text><text x="733" y="734" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">admin approves or rejects; driver is read-only</text><rect x="715" y="798" width="450" height="92" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.2"/><circle cx="737" cy="823" r="13" fill="#4b5563"/><text x="737" y="829" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="759" y="829" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Actions + records</text><text x="733" y="856" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">approved action runs; everything is logged</text><path d="M 940.0 252 L 940.0 282" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 940.0 374 L 940.0 404" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 940.0 504 L 940.0 534" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 940.0 646 L 940.0 676" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 940.0 768 L 940.0 798" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 640 270 L 715 206" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 640 490 L 715 462" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><path d="M 640 705 L 715 490" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><text x="1220" y="148" font-size="17" font-weight="700" fill="#15803d" text-anchor="start">Outside the backend</text><rect x="1220" y="165" width="430" height="262" rx="14" fill="#fff4d6" stroke="#b45309" stroke-width="2.2"/><text x="1238" y="196" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Safeguards built in</text><text x="1238" y="223" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Data trust: HMAC-signed readings, replay and</text><text x="1238" y="246" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">spoof checks, evidence hashes</text><text x="1238" y="269" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">AI safety: every number checked, fixed action</text><text x="1238" y="292" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">menu, rule text if the AI is off</text><text x="1238" y="315" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Human oversight: admin-only approvals, driver</text><text x="1238" y="338" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">is read-only</text><text x="1238" y="361" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Accountability: login + lockout, audit log of</text><text x="1238" y="384" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">every decision</text><rect x="1220" y="520" width="430" height="130" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="2.2"/><text x="1238" y="551" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Dashboard + Telegram</text><text x="1238" y="578" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">admin: approve, override, report</text><text x="1238" y="601" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">driver: alerts, read-only</text><text x="1238" y="624" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">Telegram: one message per alert</text><path d="M 1165 590 L 1220 590" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/><circle cx="1330" cy="700.4" r="12.0" fill="#15803d"/><path d="M 1306.0 735.6 Q 1306.0 716.4 1330 716.4 Q 1354.0 716.4 1354.0 735.6 Z" fill="#15803d"/><text x="1330" y="754.8" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Admin</text><text x="1330" y="777.8" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">human approval</text><path d="M 1165 722 L 1285 722" fill="none" stroke="#15803d" stroke-width="2.4" marker-end="url(#head-15803d)" marker-start="url(#head-15803d)"/><rect x="1220" y="790" width="430" height="120" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="2.2"/><text x="1238" y="821" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Records</text><text x="1238" y="848" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">incident report (.docx) + evidence photos</text><text x="1238" y="871" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">GS1 EPCIS 2.0 hash-ID events</text><text x="1238" y="894" font-size="16" font-weight="400" fill="#52606d" text-anchor="start">audit log of every decision</text><path d="M 1165 850 L 1220 850" fill="none" stroke="#1f2933" stroke-width="2.4" marker-end="url(#head-1f2933)"/></svg>